name: Build Mad New API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'detector-patches/**'
      - 'server/model-detector/**'
      - '.github/workflows/build-detector-release.yml'
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: write

concurrency:
  group: mad-new-api-build
  cancel-in-progress: false

jobs:
  codex-installer-acceptance:
    name: Codex installer acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Run Windows PowerShell 5.1 acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\codex-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\assets\mad-codex\install.ps1"

      - name: Run macOS acceptance
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/sh tests/codex-installer-macos.sh assets/mad-codex/install.sh

  build:
    needs: codex-installer-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Read pinned CPA commit
        id: cpa-ref
        run: |
          sha=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out upstream New API
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          ref: 5a6c53d4966b2e34690ab49f3dd19be01c88fdbe
          path: source
          fetch-depth: 1

      - name: Check out pinned CLIProxyAPI
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ steps.cpa-ref.outputs.sha }}
          path: cpa-source
          fetch-depth: 1

      - name: Install Mad API static assets
        run: |
          mkdir -p source/web/default/public
          cp -R "$GITHUB_WORKSPACE/assets/." source/web/default/public/

      - name: Apply Mad API patches
        run: |
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            git -C source apply --check "$patch"
            git -C source apply "$patch"
          done

      - name: Verify protected Mad API customizations
        working-directory: source
        run: |
          sha256sum relay/relay_task.go
          sha256sum --check "$GITHUB_WORKSPACE/guards/customizations.sha256"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: |
            source/go.sum
            cpa-source/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: source/web
        run: bun install --frozen-lockfile

      - name: Verify billing patch formatting
        working-directory: source
        run: |
          files=(
            constant/madapi_codex.go
            controller/codex_catalog.go
            controller/codex_cockpit.go
            controller/codex_compat.go
            controller/codex_compat_test.go
            controller/codex_websocket.go
            controller/internal_codex_catalog.go
            controller/internal_codex_catalog_test.go
            controller/token.go
            controller/token_test.go
            controller/playground.go
            controller/relay.go
            controller/relay_task_retry_test.go
            middleware/distributor.go
            middleware/distributor_madapi_test.go
            middleware/playground_path.go
            middleware/playground_path_test.go
            relay/channel/claude/adaptor.go
            relay/channel/claude/adaptor_responses_test.go
            relay/channel/claude/responses_via_messages.go
            relay/channel/deepseek/adaptor.go
            relay/channel/deepseek/adaptor_responses_test.go
            relay/channel/moonshot/adaptor.go
            relay/channel/moonshot/adaptor_test.go
            relay/channel/openai/cpa_responses_via_chat.go
            relay/channel/openai/cpa_responses_via_chat_test.go
            relay/common/relay_info.go
            relay/responses_handler.go
            relay/responses_handler_madapi_test.go
            model/main.go
            model/log.go
            model/task.go
            model/task_cas_test.go
            model/task_request_reservation.go
            model/task_request_reservation_test.go
            model/token.go
            relay/channel/api_request.go
            relay/channel/zhipu_4v/relay-zhipu_v4.go
            relay/channel/zhipu_4v/relay-zhipu_v4_test.go
            relay/cpa_native_codex.go
            relay/cpa_native_codex_test.go
            relay/channel/task/xai/adaptor.go
            relay/channel/task/xai/adaptor_test.go
            relay/channel/task/xai/constants.go
            relay/relay_adaptor.go
            relay/relay_adaptor_test.go
            relay/relay_task.go
            relay/relay_task_billing_test.go
            router/video-router.go
            router/relay-router.go
            service/quota.go
            service/quota_audio_test.go
            service/codexclientmodels/models.go
            service/relayconvert/cpa_channel_compat.go
            service/relayconvert/cpa_channel_compat_test.go
            service/relayconvert/cpa_responses_compat.go
            service/relayconvert/request_compat.go
            service/relayconvert/internal/cpa_common/bytes.go
            service/relayconvert/internal/cpa_responses/native.go
            service/relayconvert/internal/cpa_responses/native_test.go
            service/relayconvert/internal/cpa_responses/request.go
            service/relayconvert/internal/cpa_responses/request_test.go
            service/relayconvert/internal/cpa_responses/response.go
            service/relayconvert/internal/cpa_responses/response_test.go
            service/relayconvert/internal/cpa_responses/tools.go
            service/relayconvert/internal/cpa_responses/websocket.go
            service/relayconvert/internal/cpa_responses/websocket_test.go
            service/relayconvert/internal/oai_chat/to_oai_responses_req.go
            service/relayconvert/internal/oai_chat/to_oai_responses_req_test.go
            service/relayconvert/internal/oai_responses/native_tools_test.go
            service/relayconvert/internal/oai_responses/to_claude_messages_req.go
            service/relayconvert/internal/oai_responses/to_gemini_chat_req.go
          )
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d "${files[@]}"
            exit 1
          fi

      - name: Test backend paths
        working-directory: source
        run: go test ./controller ./middleware ./relay/common ./relay/channel/claude ./relay/channel/deepseek ./relay/channel/moonshot ./relay/channel/openai ./relay/channel/task/xai ./relay/channel/zhipu_4v ./relay ./router ./service ./service/codexclientmodels ./service/relayconvert ./service/relayconvert/internal/cpa_common ./service/relayconvert/internal/cpa_responses ./service/relayconvert/internal/oai_chat ./service/relayconvert/internal/oai_responses

      - name: Verify playground frontend
        working-directory: source/web/default
        run: |
          bun test tests/codex-config.test.ts
          bun run typecheck
          ../node_modules/.bin/oxlint -c .oxlintrc.json src/features/playground
          bun run build

      - name: Test image response compatibility service
        run: python3 -m unittest discover -s server/image-url-compat -p 'test_*.py'

      - name: Test Codex route reconciliation
        run: python3 -m unittest server/cpa-codex/test_patch_nginx.py

      - name: Test CPA front-proxy catalogs
        run: python3 -m unittest server/cpa-codex/test_catalog_sync.py

      - name: Test CPA front-proxy deployment reconciliation
        run: python3 -m unittest server/cpa-codex/test_compose_reconcile.py

      - name: Test disaster recovery tooling
        run: python3 -m unittest discover -s server/disaster-recovery -p 'test_*.py'

      - name: Verify CPA deployment scripts
        run: |
          sh -n server/new-api-autoupdate.sh
          sh -n server/cpa-codex/entrypoint.sh
          sh -n server/cpa-codex/sidecar-autodeploy.sh
          sh -n server/disaster-recovery/install.sh

      - name: Apply and test CPA full Codex front proxy
        working-directory: cpa-source
        run: |
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          gofmt -w \
            internal/config/config_types.go \
            internal/runtime/executor/openai_compat_executor.go \
            internal/runtime/executor/openai_compat_executor_madapi_test.go \
            internal/runtime/executor/claude_executor_execute.go \
            internal/runtime/executor/claude_executor_request.go \
            internal/runtime/executor/claude_executor_stream.go \
            internal/runtime/executor/claude_executor_test.go \
            internal/runtime/executor/claude_executor_tokens.go \
            internal/translator/claude/openai/responses/claude_openai-responses_request.go \
            internal/translator/claude/openai/responses/claude_openai-responses_request_test.go \
            internal/translator/openai/openai/responses/openai_openai-responses_request_test.go \
            internal/translator/openai/openai/responses/openai_openai-responses_tools.go \
            internal/watcher/synthesizer/config.go \
            sdk/api/handlers/openai/madapi_responses_session.go \
            sdk/api/handlers/openai/madapi_responses_session_test.go \
            sdk/api/handlers/openai/openai_responses_handlers.go \
            sdk/cliproxy/auth/conductor_execution.go \
            sdk/cliproxy/auth/madapi_passthrough_test.go
          go test ./internal/runtime/executor ./internal/translator/claude/openai/responses ./internal/translator/openai/openai/responses ./internal/watcher/synthesizer ./sdk/api/handlers/openai ./sdk/cliproxy/auth

      - name: Build image
        run: docker build --pull --tag mad-new-api:latest source

      - name: Build CPA full Codex front-proxy image
        run: docker build --pull --build-arg CPA_PATCHED=1 --file server/cpa-codex/Dockerfile --tag mad-cpa-codex:latest .

      - name: Verify CPA runtime dependencies
        run: docker run --rm --entrypoint python3 mad-cpa-codex:latest --version

      - name: Verify CPA catalog synchronizer entrypoint
        run: docker run --rm --entrypoint /bin/sh mad-cpa-codex:latest -c 'test "$(head -n 1 /usr/local/bin/catalog-sync.py)" = "#!/usr/bin/env python3"'

      - name: Export image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker save mad-new-api:latest | gzip -1 > mad-new-api.tar.gz
          sha256sum mad-new-api.tar.gz > mad-new-api.tar.gz.sha256
          docker save mad-cpa-codex:latest | gzip -1 > mad-cpa-codex.tar.gz
          sha256sum mad-cpa-codex.tar.gz > mad-cpa-codex.tar.gz.sha256
          tar -C site/mad-home -czf mad-home.tar.gz .
          cp server/image-url-compat/service.py image-url-compat.py
          cp server/image-url-compat/image-url-compat.service image-url-compat.service
          cp server/image-url-compat/patch_nginx.py patch-image-compat-nginx.py
          cp server/new-api-autoupdate.sh new-api-autoupdate.sh
          cp server/cpa-codex/sidecar-autodeploy.sh cpa-codex-autodeploy.sh
          cp server/cpa-codex/patch_nginx.py patch-cpa-codex-nginx.py
          cp server/cpa-codex/compose_reconcile.py compose-cpa-codex.py
          cp guards/cpa-upstream-commit.txt cpa-upstream-commit.txt
          sha256sum mad-home.tar.gz > mad-home.tar.gz.sha256
          sha256sum image-url-compat.py > image-url-compat.py.sha256
          sha256sum image-url-compat.service > image-url-compat.service.sha256
          sha256sum patch-image-compat-nginx.py > patch-image-compat-nginx.py.sha256
          sha256sum new-api-autoupdate.sh > new-api-autoupdate.sh.sha256
          sha256sum cpa-codex-autodeploy.sh > cpa-codex-autodeploy.sh.sha256
          sha256sum patch-cpa-codex-nginx.py > patch-cpa-codex-nginx.py.sha256
          sha256sum compose-cpa-codex.py > compose-cpa-codex.py.sha256
          sha256sum cpa-upstream-commit.txt > cpa-upstream-commit.txt.sha256
          git -C source rev-parse HEAD > upstream-commit.txt

      - name: Publish stable release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --cleanup-tag --yes || true
          gh release create build-latest \
            mad-new-api.tar.gz \
            mad-new-api.tar.gz.sha256 \
            mad-cpa-codex.tar.gz \
            mad-cpa-codex.tar.gz.sha256 \
            mad-home.tar.gz \
            mad-home.tar.gz.sha256 \
            image-url-compat.py \
            image-url-compat.py.sha256 \
            image-url-compat.service \
            image-url-compat.service.sha256 \
            patch-image-compat-nginx.py \
            patch-image-compat-nginx.py.sha256 \
            new-api-autoupdate.sh \
            new-api-autoupdate.sh.sha256 \
            cpa-codex-autodeploy.sh \
            cpa-codex-autodeploy.sh.sha256 \
            patch-cpa-codex-nginx.py \
            patch-cpa-codex-nginx.py.sha256 \
            compose-cpa-codex.py \
            compose-cpa-codex.py.sha256 \
            cpa-upstream-commit.txt \
            cpa-upstream-commit.txt.sha256 \
            upstream-commit.txt \
            --title "Mad New API latest build" \
            --notes "Automated build from the pinned upstream New API source with Mad API billing, branding, recharge, multi-model playground, and image response compatibility customizations."
