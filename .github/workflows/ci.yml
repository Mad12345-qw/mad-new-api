name: MadAPI acceptance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: madapi-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and routing boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        shell: bash
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet, build, and test
        shell: bash
        run: |
          go vet ./...
          go build ./...
          make test
          go test ./middleware -run 'TrustedRoute|RouteGroup' -count=1

      - name: Set up Go for official CPA SDK host
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ops/cpa-sdk-host/go.mod
          cache-dependency-path: ops/cpa-sdk-host/go.sum

      - name: Test official CPA SDK host
        working-directory: ops/cpa-sdk-host
        shell: bash
        run: |
          go test ./...
          go build ./...

  frontend:
    name: Frontend and product assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Validate Claude and homepage assets
        shell: bash
        run: |
          node tests/claude-image-mcp.mjs web/public/mad-claude/image-tool/server.mjs
          node tests/claude-image-widget.mjs web/public/mad-claude/image-tool/widget.html
          node tests/claude-image-cache-restart.mjs web/public/mad-claude/image-tool
          node tests/mad-home-default-theme.mjs product/mad-home/default-theme.js

  agent-installers:
    name: Agent installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\codex-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-codex\install.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\claude-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\install.ps1" `
            -ImageToolPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\image-tool"
          $env:MADAPI_CLAUDE_LANGUAGE_DRY_RUN = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\web\public\mad-claude\install-language.ps1"

      - name: Validate macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/sh tests/codex-installer-macos.sh web/public/mad-codex/install.sh
          /bin/sh tests/claude-installer-macos.sh web/public/mad-claude/install.sh web/public/mad-claude/image-tool
          MADAPI_CLAUDE_LANGUAGE_DRY_RUN=1 /bin/sh web/public/mad-claude/install-language.sh

  operations:
    name: Operations, alerts, detector, and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate official CPA pin and source boundary
        shell: bash
        run: |
          sha=$(tr -d '[:space:]' < ops/release/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          test "$(git ls-remote https://github.com/router-for-me/CLIProxyAPI.git refs/tags/v7.2.128 | awk '{print $1}')" = "$sha"
          test ! -d patches
          test ! -d guards
          grep -Fxq 'require github.com/router-for-me/CLIProxyAPI/v7 v7.2.128' \
            ops/cpa-sdk-host/go.mod
          ! grep -n -E 'Mad12345-qw/CLIProxyAPI|Apply Mad API patches|calciumion/new-api' \
            .github/workflows/build-release.yml \
            .github/workflows/publish-home.yml \
            .github/workflows/build-detector-release.yml

      - name: Validate operations tools
        env:
          DETECTOR_MASTER_KEY: ci-test-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-test-admin-token-not-for-production
          DETECTOR_DATA_DIR: ${{ runner.temp }}/detector-data
        shell: bash
        run: |
          for script in ops/release/*.sh ops/disaster-recovery/*.sh ops/docker-disk-guard/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s ops/disaster-recovery -p 'test_*.py'
          python3 -m unittest discover -s ops/mad-api-error-alert -p 'test_*.py'
          python3 -m unittest discover -s ops/release -p 'test_*.py'
          printf 'disable-image-generation: "passthrough"\n' > "$RUNNER_TEMP/cpa-config.yaml"
          ops/release/verify-cpa-config.sh "$RUNNER_TEMP/cpa-config.yaml"
          python3 -m pip install -r ops/model-detector/requirements.txt
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python3 -m unittest discover -s ops/model-detector -p 'test_*.py'
          python3 -m compileall -q ops/model-detector

      - name: Build exact release images
        shell: bash
        run: |
          sha=$(tr -d '[:space:]' < ops/release/cpa-upstream-commit.txt)
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git official-cpa
          git -C official-cpa fetch --depth=1 origin "$sha"
          git -C official-cpa checkout --detach "$sha"
          test "$(git -C official-cpa rev-parse HEAD)" = "$sha"
          docker build --tag mad-new-api:pr .
          docker build --tag mad-cpa-codex:pr official-cpa
          docker build --tag mad-cpa-sdk-host:pr ops/cpa-sdk-host
          docker run --rm --entrypoint /bin/sh mad-cpa-codex:pr \
            -c 'test -x /CLIProxyAPI/CLIProxyAPI && test ! -e /app/plugins/madapi-dynamic.so'
          docker run --rm --entrypoint /bin/sh mad-cpa-sdk-host:pr \
            -c 'test -x /usr/local/bin/mad-cpa-sdk-host'
