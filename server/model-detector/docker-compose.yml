services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      new-api:
        condition: service_healthy
      model-detector:
        condition: service_healthy

  new-api:
    image: mad-new-api-detector:${RELEASE_TAG}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /data/new-api.db?_busy_timeout=30000
      SESSION_SECRET: ${NEW_API_SESSION_SECRET}
    volumes:
      - ./data/new-api:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s

  detector-init:
    image: mad-model-detector:${RELEASE_TAG}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /data"]
    restart: "no"
    volumes:
      - ./data/detector:/data

  model-detector:
    image: mad-model-detector:${RELEASE_TAG}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DETECTOR_DATA_DIR: /data
      DETECTOR_MASTER_KEY: ${DETECTOR_MASTER_KEY}
      DETECTOR_ADMIN_TOKEN: ${DETECTOR_ADMIN_TOKEN}
      DETECTOR_TIMEOUT_SECONDS: ${DETECTOR_TIMEOUT_SECONDS:-30}
      DETECTOR_NEW_API_INTERNAL_URL: http://new-api:3000
    volumes:
      - ./data/detector:/data
    depends_on:
      detector-init:
        condition: service_completed_successfully
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
