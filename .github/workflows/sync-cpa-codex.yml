name: Sync Native CPA Gateway

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current upstream commit
        required: false
        default: false
        type: boolean
  schedule:
    # 04:00 Asia/Shanghai. GitHub schedules are expressed in UTC.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: mad-new-api-build
  cancel-in-progress: false

jobs:
  sync-native-cpa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out MadAPI build configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve controlled CPA source commit
        id: upstream
        run: |
          candidate=$(git ls-remote https://github.com/Mad12345-qw/CLIProxyAPI.git refs/heads/madapi/full-selected-channel-runtime | awk '{print $1}')
          pinned=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#candidate} -eq 40
          test ${#pinned} -eq 40
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$candidate" != "$pinned" ] || [ "${{ inputs.force || false }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out controlled CPA source candidate
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: Mad12345-qw/CLIProxyAPI
          ref: ${{ steps.upstream.outputs.candidate }}
          path: cpa-source
          fetch-depth: 1

      - name: Set up Go
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: cpa-source/go.sum

      - name: Test native CPA packaging and deployment assets
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python3 -m unittest server/cpa-codex-native/test_compose_reconcile.py
          python3 -m unittest server/cpa-codex-native/test_patch_nginx.py
          sh -n server/cpa-codex-native/entrypoint.sh
          sh -n server/cpa-codex-native/autodeploy.sh

      - name: Build native CPA image
        if: steps.upstream.outputs.changed == 'true'
        run: docker build --pull --file server/cpa-codex-native/Dockerfile --tag mad-cpa-codex:latest .

      - name: Verify integrated CPA image contents
        if: steps.upstream.outputs.changed == 'true'
        run: docker run --rm --entrypoint /bin/sh mad-cpa-codex:latest -c 'test -x /CLIProxyAPI/CLIProxyAPI && test ! -e /app/plugins/madapi-dynamic.so'

      - name: Exercise native CPA runtime
        if: steps.upstream.outputs.changed == 'true'
        run: python3 server/cpa-codex-native/test_runtime_acceptance.py --image mad-cpa-codex:latest

      - name: Export CPA-only release assets
        if: steps.upstream.outputs.changed == 'true'
        run: |
          docker save mad-cpa-codex:latest | gzip -1 > mad-cpa-codex.tar.gz
          sha256sum mad-cpa-codex.tar.gz > mad-cpa-codex.tar.gz.sha256
          cp server/cpa-codex-native/autodeploy.sh cpa-codex-autodeploy.sh
          cp server/cpa-codex-native/patch_nginx.py patch-cpa-codex-nginx.py
          cp server/cpa-codex-native/compose_reconcile.py compose-cpa-codex.py
          printf '%s\n' '${{ steps.upstream.outputs.candidate }}' > cpa-upstream-commit.txt
          sha256sum cpa-codex-autodeploy.sh > cpa-codex-autodeploy.sh.sha256
          sha256sum patch-cpa-codex-nginx.py > patch-cpa-codex-nginx.py.sha256
          sha256sum compose-cpa-codex.py > compose-cpa-codex.py.sha256
          sha256sum cpa-upstream-commit.txt > cpa-upstream-commit.txt.sha256

      - name: Publish only CPA assets
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload build-latest \
            mad-cpa-codex.tar.gz \
            mad-cpa-codex.tar.gz.sha256 \
            cpa-codex-autodeploy.sh \
            cpa-codex-autodeploy.sh.sha256 \
            patch-cpa-codex-nginx.py \
            patch-cpa-codex-nginx.py.sha256 \
            compose-cpa-codex.py \
            compose-cpa-codex.py.sha256 \
            cpa-upstream-commit.txt \
            cpa-upstream-commit.txt.sha256 \
            --clobber

      - name: Record the verified CPA commit
        if: steps.upstream.outputs.changed == 'true'
        env:
          CANDIDATE: ${{ steps.upstream.outputs.candidate }}
        run: |
          printf '%s\n' "$CANDIDATE" > guards/cpa-upstream-commit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guards/cpa-upstream-commit.txt
          if git diff --cached --quiet; then
            echo 'The verified native CPA commit was rebuilt without changing the pin.'
            exit 0
          fi
          git commit -m "chore: sync native CPA gateway to ${CANDIDATE:0:12}"
          git push origin HEAD:main

      - name: Report no update
        if: steps.upstream.outputs.changed != 'true'
        run: echo 'Native CPA gateway is already aligned with the controlled CPA source.'
