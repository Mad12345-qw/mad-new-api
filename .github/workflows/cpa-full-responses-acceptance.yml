name: CPA Full Responses Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'guards/cpa-upstream-commit.txt'
      - 'server/cpa-codex-native/**'
      - 'server/cpa-codex/catalog_sync.py'
      - 'server/cpa-codex/test_catalog_sync.py'
      - '.github/workflows/cpa-full-responses-acceptance.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned integrated CPA commit
        id: cpa-ref
        run: |
          sha=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out pinned MadAPI CPA fork
        uses: actions/checkout@v4
        with:
          repository: Mad12345-qw/CLIProxyAPI
          ref: ${{ steps.cpa-ref.outputs.sha }}
          path: cpa-source
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: cpa-source/go.sum

      - name: Verify integrated source formatting
        working-directory: cpa-source
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- '*.go')
          test -n "$changed"
          unformatted=$(printf '%s\n' "$changed" | xargs gofmt -l)
          test -z "$unformatted"

      - name: Verify integrated runtime
        working-directory: cpa-source
        run: |
          GOMAXPROCS=4 go test -p 4 ./internal/api ./internal/translator/claude/openai/responses ./internal/translator/openai/openai/responses ./internal/watcher/synthesizer ./sdk/api/handlers/openai ./sdk/cliproxy/auth
          GOMAXPROCS=4 go test -p 4 -run '^(TestApplyMadAPIPassthroughAuthorization|TestBuildClaudeCompactResponseUsesCompactionContract|TestEnsureImageGenerationTool_MadAPIPassthroughResponsesLiteInjectsTool)$' ./internal/runtime/executor
          go build ./cmd/server
