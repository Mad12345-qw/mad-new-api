name: CPA Full Responses Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'server/cpa-codex-full/**'
      - 'server/cpa-codex/patches/0001-madapi-native-codex-dispatch.patch'
      - 'server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch'
      - 'server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch'
      - 'server/cpa-codex/patches/0006-openai-responses-string-input.patch'
      - 'server/cpa-codex/patches/0007-claude-web-search-beta.patch'
      - 'server/cpa-codex/patches/0008-claude-cloak-auth-attributes.patch'
      - 'server/cpa-codex/patches/0009-claude-custom-tool-roundtrip.patch'
      - 'server/cpa-codex/patches/0010-claude-native-api-wire-mode.patch'
      - 'server/cpa-codex/patches/0011-claude-web-search-events.patch'
      - 'server/cpa-codex/patches/0012-claude-compaction-replay.patch'
      - 'server/cpa-codex/patches/0013-madapi-first-event-failover.patch'
      - 'server/cpa-codex/patches/0014-madapi-protocol-routing.patch'
      - 'server/cpa-codex/patches/0015-madapi-production-hardening.patch'
      - 'server/cpa-codex/patches/0016-openai-inline-thinking-normalization.patch'
      - 'server/cpa-codex/patches/0017-madapi-session-replay-compact-contract.patch'
      - 'server/cpa-codex/catalog_sync.py'
      - 'server/cpa-codex/test_catalog_sync.py'
      - '.github/workflows/cpa-full-responses-acceptance.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned CPA commit
        id: cpa-ref
        run: |
          sha=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out pinned CPA
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ steps.cpa-ref.outputs.sha }}
          path: cpa-source
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: cpa-source/go.sum

      - name: Apply the full Responses service patches
        working-directory: cpa-source
        run: |
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0001-madapi-native-codex-dispatch.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0001-madapi-native-codex-dispatch.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0008-claude-cloak-auth-attributes.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0008-claude-cloak-auth-attributes.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0009-claude-custom-tool-roundtrip.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0009-claude-custom-tool-roundtrip.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0010-claude-native-api-wire-mode.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0010-claude-native-api-wire-mode.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0011-claude-web-search-events.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0011-claude-web-search-events.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0012-claude-compaction-replay.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0012-claude-compaction-replay.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0013-madapi-first-event-failover.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0013-madapi-first-event-failover.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0014-madapi-protocol-routing.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0014-madapi-protocol-routing.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0015-madapi-production-hardening.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0015-madapi-production-hardening.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0016-openai-inline-thinking-normalization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0016-openai-inline-thinking-normalization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0017-madapi-session-replay-compact-contract.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0017-madapi-session-replay-compact-contract.patch"
          gofmt -w internal/config/config_types.go internal/watcher/synthesizer/config.go internal/watcher/synthesizer/config_test.go internal/runtime/executor/claude_executor_execute.go internal/runtime/executor/claude_executor_request.go internal/runtime/executor/claude_executor_stream.go internal/runtime/executor/claude_executor_test.go internal/runtime/executor/claude_executor_tokens.go internal/translator/claude/openai/responses/claude_openai-responses_request.go internal/translator/claude/openai/responses/claude_openai-responses_request_test.go internal/translator/claude/openai/responses/claude_openai-responses_response.go internal/translator/claude/openai/responses/claude_openai-responses_response_test.go internal/translator/openai/openai/responses/openai_openai-responses_request_test.go internal/translator/openai/openai/responses/openai_openai-responses_response.go internal/translator/openai/openai/responses/openai_openai-responses_response_test.go internal/translator/openai/openai/responses/openai_openai-responses_tools.go internal/api/madapi_native_codex.go internal/api/madapi_native_codex_test.go sdk/api/handlers/openai/madapi_responses_session.go sdk/api/handlers/openai/madapi_responses_session_test.go sdk/api/handlers/openai/openai_responses_handlers.go sdk/cliproxy/auth/conductor_execution.go sdk/cliproxy/auth/madapi_passthrough_test.go

      - name: Verify session replay and CPA handler build
        working-directory: cpa-source
        run: |
          GOMAXPROCS=1 go test -p 1 ./internal/api ./internal/translator/claude/openai/responses ./internal/translator/openai/openai/responses ./internal/watcher/synthesizer ./sdk/api/handlers/openai ./sdk/cliproxy/auth
          GOMAXPROCS=1 go test -p 1 -run '^(TestApplyMadAPIPassthroughAuthorization|TestBuildClaudeCompactResponseUsesCompactionContract)$' ./internal/runtime/executor
          go build ./cmd/server
