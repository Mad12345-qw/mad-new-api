name: Build model detector edition

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ops/model-detector/**'
      - '.github/workflows/build-detector-release.yml'

permissions:
  contents: write

concurrency:
  group: madapi-detector-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out MadAPI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test detector
        env:
          DETECTOR_MASTER_KEY: ci-test-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-test-admin-token-not-for-production
          DETECTOR_DATA_DIR: ${{ runner.temp }}/detector-data
        shell: bash
        run: |
          python3 -m pip install -r ops/model-detector/requirements.txt
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python3 -m unittest discover -s ops/model-detector -p 'test_*.py'
          python3 -m compileall -q ops/model-detector
          python3 - <<'PY'
          from pathlib import Path
          html = Path('ops/model-detector/ui/index.html').read_text(encoding='utf-8')
          script = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/model-detector-ui.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/model-detector-ui.js

      - name: Validate detector Compose
        env:
          PUBLIC_PORT: '3010'
          RELEASE_TAG: detector-latest
          NEW_API_SESSION_SECRET: ci-new-api-session-secret-not-for-production
          DETECTOR_MASTER_KEY: ci-test-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-test-admin-token-not-for-production
        shell: bash
        run: docker compose -f ops/model-detector/docker-compose.yml config >/dev/null

      - name: Build release images from current source
        shell: bash
        run: |
          docker build --pull --tag mad-new-api-detector:detector-latest .
          docker build --pull --tag mad-model-detector:detector-latest ops/model-detector

      - name: Export detector bundle
        shell: bash
        run: |
          docker save mad-new-api-detector:detector-latest | gzip -1 > mad-new-api-detector.tar.gz
          docker save mad-model-detector:detector-latest | gzip -1 > mad-model-detector.tar.gz
          cp ops/model-detector/docker-compose.yml docker-compose.detector.yml
          cp ops/model-detector/nginx.conf nginx.detector.conf
          cp ops/model-detector/env.example detector.env.example
          sha256sum \
            mad-new-api-detector.tar.gz \
            mad-model-detector.tar.gz \
            docker-compose.detector.yml \
            nginx.detector.conf \
            detector.env.example > detector-release.sha256
          git rev-parse HEAD > detector-build-commit.txt

      - name: Publish detector release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete detector-latest --cleanup-tag --yes || true
          gh release create detector-latest \
            mad-new-api-detector.tar.gz \
            mad-model-detector.tar.gz \
            docker-compose.detector.yml \
            nginx.detector.conf \
            detector.env.example \
            detector-release.sha256 \
            detector-build-commit.txt \
            --title "MadAPI model detector edition" \
            --notes "Built directly from the same MadAPI source tree with the detector isolated as a separate service."
