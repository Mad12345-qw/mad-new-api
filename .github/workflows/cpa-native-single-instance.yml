name: CPA Native Single Instance Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/cpa-codex-native/**'
      - 'assets/mad-codex/**'
      - 'tests/codex-installer-*'
      - 'guards/cpa-upstream-commit.txt'
      - '.github/workflows/cpa-native-single-instance.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'server/cpa-codex-native/**'
      - 'assets/mad-codex/**'
      - 'tests/codex-installer-*'
      - 'guards/cpa-upstream-commit.txt'
      - '.github/workflows/cpa-native-single-instance.yml'

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\codex-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\assets\mad-codex\install.ps1"
      - if: runner.os == 'macOS'
        shell: bash
        run: /bin/sh tests/codex-installer-macos.sh assets/mad-codex/install.sh

  native-cpa:
    name: Native CPA image
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: cpa-ref
        run: |
          sha=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Mad12345-qw/CLIProxyAPI
          ref: ${{ steps.cpa-ref.outputs.sha }}
          path: cpa-source
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: cpa-source/go.sum
      - name: Test deployment reconciliation
        run: |
          python3 -m unittest server/cpa-codex-native/test_compose_reconcile.py
          python3 -m unittest server/cpa-codex-native/test_patch_nginx.py
          sh -n server/cpa-codex-native/entrypoint.sh
          sh -n server/cpa-codex-native/autodeploy.sh
      - name: Build native single-instance image
        run: |
          docker build --pull --file server/cpa-codex-native/Dockerfile --tag mad-cpa-codex:native-acceptance .
      - name: Verify native image contents
        run: |
          docker run --rm --entrypoint /bin/sh mad-cpa-codex:native-acceptance -c 'test -x /CLIProxyAPI/CLIProxyAPI && test ! -e /app/plugins/madapi-dynamic.so'
      - name: Exercise native image routing
        run: python3 server/cpa-codex-native/test_runtime_acceptance.py --image mad-cpa-codex:native-acceptance
