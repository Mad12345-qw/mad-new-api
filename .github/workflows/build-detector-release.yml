name: Build Model Detector Subsystem

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mad-new-api-detector-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out detector source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/model-detector/requirements.txt

      - name: Install detector dependencies
        run: python -m pip install -r server/model-detector/requirements.txt

      - name: Test detector engine and integration policy
        env:
          DETECTOR_MASTER_KEY: ci-test-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-test-admin-token-not-for-production
          DETECTOR_DATA_DIR: ${{ runner.temp }}/detector-data
        run: |
          python -m unittest discover -s server/model-detector -p 'test_*.py'
          python -m compileall -q server/model-detector

      - name: Validate detector inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('server/model-detector/ui/index.html').read_text(encoding='utf-8')
          script = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/model-detector-ui.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/model-detector-ui.js

      - name: Validate standalone Compose configuration
        env:
          RELEASE_TAG: detector-latest
          DETECTOR_LOCAL_PORT: "3011"
          MAD_PLATFORM_NETWORK: mad-platform
          DETECTOR_MASTER_KEY: ci-detector-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-detector-admin-token-not-for-production
          MODEL_DETECTOR_SERVICE_TOKEN: ci-model-detector-service-token-not-for-production
          DETECTOR_NEW_API_INTERNAL_URL: http://mad-new-api:3000
        run: docker compose -f server/model-detector/docker-compose.standalone.yml config >/dev/null

      - name: Build standalone detector image
        run: docker build --pull --tag mad-model-detector:detector-latest server/model-detector

      - name: Export standalone release bundle
        run: |
          docker save mad-model-detector:detector-latest | gzip -1 > mad-model-detector.tar.gz
          cp server/model-detector/docker-compose.standalone.yml docker-compose.detector.yml
          cp server/model-detector/env.standalone.example detector.env.example
          sha256sum \
            mad-model-detector.tar.gz \
            docker-compose.detector.yml \
            detector.env.example > detector-release.sha256
          git rev-parse HEAD > detector-build-commit.txt

      - name: Publish detector release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete detector-latest --cleanup-tag --yes || true
          gh release create detector-latest \
            mad-model-detector.tar.gz \
            docker-compose.detector.yml \
            detector.env.example \
            detector-release.sha256 \
            detector-build-commit.txt \
            --title "TraceGuard model detector subsystem" \
            --notes "Independent detector image, database, authentication and release lifecycle. New API integration uses the versioned internal service contract."
