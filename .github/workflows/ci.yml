name: MadAPI acceptance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: madapi-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and routing boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        shell: bash
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet, build, and test
        shell: bash
        run: |
          go vet ./...
          go build ./...
          make test

  frontend:
    name: Frontend and product assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun test \
            src/features/keys/lib/__tests__/agent-access-config.test.ts \
            src/features/keys/lib/__tests__/v3-ui-parity.test.ts \
            src/features/wallet/types.test.ts

      - name: Validate Claude and homepage assets
        shell: bash
        run: |
          node tests/claude-image-mcp.mjs web/public/mad-claude/image-tool/server.mjs
          node tests/claude-image-widget.mjs web/public/mad-claude/image-tool/widget.html
          node tests/claude-image-cache-restart.mjs web/public/mad-claude/image-tool
          node tests/mad-home-default-theme.mjs product/mad-home/default-theme.js
          (cd product/frozen-v3-ui && sha256sum -c madapi-v3-ui.tar.gz.sha256)
          mkdir -p "$RUNNER_TEMP/frozen-v3-ui"
          tar -xzf product/frozen-v3-ui/madapi-v3-ui.tar.gz -C "$RUNNER_TEMP/frozen-v3-ui"
          test -s "$RUNNER_TEMP/frozen-v3-ui/dist/index.html"
          grep -Fq '<html lang="zh-CN">' "$RUNNER_TEMP/frozen-v3-ui/dist/index.html"
          grep -Fq '<title>Mad API</title>' "$RUNNER_TEMP/frozen-v3-ui/dist/index.html"
          ! grep -Fq '/mad-home/oauth-bridge-v3.js' "$RUNNER_TEMP/frozen-v3-ui/dist/index.html"

  agent-installers:
    name: Agent installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\codex-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-codex\install.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\claude-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\install.ps1" `
            -ImageToolPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\image-tool"
          $env:MADAPI_CLAUDE_LANGUAGE_DRY_RUN = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\web\public\mad-claude\install-language.ps1"

      - name: Validate macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/sh tests/codex-installer-macos.sh web/public/mad-codex/install.sh
          /bin/sh tests/codex-image-skill-macos.sh web/public/mad-codex/image-skill/scripts/generate.sh
          /bin/sh tests/claude-installer-macos.sh web/public/mad-claude/install.sh web/public/mad-claude/image-tool
          MADAPI_CLAUDE_LANGUAGE_DRY_RUN=1 /bin/sh web/public/mad-claude/install-language.sh

  operations:
    name: Operations, alerts, detector, and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate native release boundary
        shell: bash
        run: |
          test ! -d patches
          test ! -d guards
          ! grep -n -E 'Mad12345-qw/CLIProxyAPI|Apply Mad API patches|calciumion/new-api|mad-cpa-official-gateway|cpa-upstream-commit' \
            .github/workflows/build-release.yml \
            .github/workflows/publish-home.yml \
            .github/workflows/build-detector-release.yml

      - name: Validate operations tools
        env:
          DETECTOR_MASTER_KEY: ci-test-master-key-not-for-production
          DETECTOR_ADMIN_TOKEN: ci-test-admin-token-not-for-production
          DETECTOR_DATA_DIR: ${{ runner.temp }}/detector-data
        shell: bash
        run: |
          for script in ops/release/*.sh ops/disaster-recovery/*.sh ops/docker-disk-guard/*.sh; do
            bash -n "$script"
          done
          ops/release/validate-newapi-only-release.sh
          python3 ops/release/test-patch-nginx-unified-route.py
          python3 -m unittest discover -s ops/disaster-recovery -p 'test_*.py'
          python3 -m unittest discover -s ops/mad-api-error-alert -p 'test_*.py'
          python3 -m pip install -r ops/model-detector/requirements.txt
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python3 -m unittest discover -s ops/model-detector -p 'test_*.py'
          python3 -m compileall -q ops/model-detector

      - name: Build exact release images
        shell: bash
        run: |
          docker build --tag mad-new-api:pr .

      - name: Export NewAPI candidate image
        shell: bash
        run: docker save mad-new-api:pr | gzip -1 > mad-new-api-pr.tar.gz

      - name: Upload NewAPI candidate image
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mad-new-api-pr-image
          path: mad-new-api-pr.tar.gz
          if-no-files-found: error
          retention-days: 1
