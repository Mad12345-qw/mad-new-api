name: Build MadAPI release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: madapi-release
  cancel-in-progress: false

jobs:
  agent-installers:
    name: Agent installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out MadAPI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\codex-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-codex\install.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\claude-installer-windows.ps1" `
            -InstallerPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\install.ps1" `
            -ImageToolPath "$env:GITHUB_WORKSPACE\web\public\mad-claude\image-tool"
          $env:MADAPI_CLAUDE_LANGUAGE_DRY_RUN = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\web\public\mad-claude\install-language.ps1"

      - name: Validate macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/sh tests/codex-installer-macos.sh web/public/mad-codex/install.sh
          /bin/sh tests/codex-image-skill-macos.sh web/public/mad-codex/image-skill/scripts/generate.sh
          /bin/sh tests/claude-installer-macos.sh web/public/mad-claude/install.sh web/public/mad-claude/image-tool
          MADAPI_CLAUDE_LANGUAGE_DRY_RUN=1 /bin/sh web/public/mad-claude/install-language.sh

  build:
    name: Build immutable release
    needs: agent-installers
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out MadAPI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve official CPA source
        id: cpa
        shell: bash
        run: |
          sha=$(tr -d '[:space:]' < ops/release/cpa-upstream-commit.txt)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify source boundaries
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/router-for-me/CLIProxyAPI.git refs/tags/v7.2.128 | awk '{print $1}')" = "${{ steps.cpa.outputs.sha }}"
          grep -Fq 'github.com/router-for-me/CLIProxyAPI/v7 v7.2.128' ops/cpa-official-gateway/go.mod
          ! grep -Eq '^[[:space:]]*replace[[:space:]].*CLIProxyAPI' ops/cpa-official-gateway/go.mod
          test ! -d patches
          test ! -d guards

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Validate frontend contracts
        working-directory: web
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            src/features/keys/lib/__tests__/agent-access-config.test.ts \
            src/features/wallet/types.test.ts

      - name: Validate product assets
        shell: bash
        run: |
          node tests/claude-image-mcp.mjs web/public/mad-claude/image-tool/server.mjs
          node tests/claude-image-widget.mjs web/public/mad-claude/image-tool/widget.html
          node tests/claude-image-cache-restart.mjs web/public/mad-claude/image-tool
          node tests/mad-home-default-theme.mjs product/mad-home/default-theme.js
          grep -Fq 'https://mad.myddns.me/codex/v1' product/mad-home/index.html

      - name: Validate operations tools
        shell: bash
        run: |
          for script in ops/release/*.sh ops/disaster-recovery/*.sh ops/docker-disk-guard/*.sh; do
            bash -n "$script"
          done
          ops/release/validate-unified-orchestration.sh
          python3 ops/release/test-patch-nginx-unified-route.py
          python3 -m unittest discover -s ops/disaster-recovery -p 'test_*.py'
          python3 -m unittest discover -s ops/mad-api-error-alert -p 'test_*.py'
          python3 -m py_compile ops/release/*.py ops/model-detector/*.py
          ops/release/render-codex-route.sh \
            http://127.0.0.1:18317 \
            http://127.0.0.1:3000 \
            "$RUNNER_TEMP/codex-route.conf"
          grep -Fq 'proxy_pass http://127.0.0.1:18317' "$RUNNER_TEMP/codex-route.conf"
          grep -Fq 'proxy_pass http://127.0.0.1:3000' "$RUNNER_TEMP/codex-route.conf"
          grep -Fq 'location ^~ /codex/v1/' "$RUNNER_TEMP/codex-route.conf"
          grep -Fq 'location ^~ /v1/' "$RUNNER_TEMP/codex-route.conf"

      - name: Build MadAPI image directly from this repository
        shell: bash
        run: |
          docker build --pull \
            --tag mad-new-api:latest \
            --tag "mad-new-api:${GITHUB_SHA}" .

      - name: Build official CPA gateway image
        shell: bash
        run: |
          docker build --pull \
            --tag mad-cpa-official-gateway:latest \
            --tag "mad-cpa-official-gateway:${GITHUB_SHA}" \
            ops/cpa-official-gateway
          docker run --rm --entrypoint /bin/sh mad-cpa-official-gateway:latest \
            -c 'test -x /usr/local/bin/madapi-cpa-official-gateway'

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release
          docker save mad-new-api:latest | gzip -1 > release/mad-new-api.tar.gz
          docker save mad-cpa-official-gateway:latest | gzip -1 > release/mad-cpa-official-gateway.tar.gz
          tar -C product/mad-home -czf release/mad-home.tar.gz .
          tar -czf release/madapi-release-tools.tar.gz \
            ops/release \
            ops/disaster-recovery \
            ops/docker-disk-guard \
            ops/mad-api-error-alert
          cp ops/release/cpa-upstream-commit.txt release/cpa-upstream-commit.txt
          cat > release/release-manifest.json <<EOF
          {
            "release_format": 1,
            "madapi_commit": "${GITHUB_SHA}",
            "newapi_source": "Mad12345-qw/mad-new-api",
            "cpa_source": "router-for-me/CLIProxyAPI v7 embedded through the official Go module",
            "cpa_commit": "${{ steps.cpa.outputs.sha }}",
            "cpa_version": "v7.2.128",
            "cpa_image_generation_mode": false,
            "newapi_image": "mad-new-api:latest",
            "cpa_image": "mad-cpa-official-gateway:latest"
          }
          EOF
          cd release
          sha256sum \
            mad-new-api.tar.gz \
            mad-cpa-official-gateway.tar.gz \
            mad-home.tar.gz \
            madapi-release-tools.tar.gz \
            cpa-upstream-commit.txt \
            release-manifest.json > SHA256SUMS

      - name: Publish build-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete build-latest --cleanup-tag --yes || true
          gh release create build-latest release/* \
            --target "$GITHUB_SHA" \
            --title "MadAPI official CPA release" \
            --notes "Built directly from this repository. CPA owns the complete Codex protocol path through the pinned official v7 module; NewAPI owns authentication, channel selection, billing, refunds, and logs."
