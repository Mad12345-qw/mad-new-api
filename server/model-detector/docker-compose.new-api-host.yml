services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-3010}:80"
    volumes:
      - ./nginx.platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      new-api:
        condition: service_healthy

  new-api:
    image: mad-new-api:${NEW_API_RELEASE_TAG:-latest}
    container_name: mad-new-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /data/new-api.db?_busy_timeout=30000
      SESSION_SECRET: ${NEW_API_SESSION_SECRET}
      MODEL_DETECTOR_SERVICE_TOKEN: ${MODEL_DETECTOR_SERVICE_TOKEN}
    volumes:
      - ${NEW_API_DATA_DIR:-./data/new-api}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s

networks:
  default:
    name: ${MAD_PLATFORM_NETWORK:-mad-platform}
    external: true
