services:
  detector-init:
    image: mad-model-detector:${RELEASE_TAG}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /data"]
    restart: "no"
    volumes:
      - ./data:/data

  model-detector:
    image: mad-model-detector:${RELEASE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DETECTOR_LOCAL_PORT:-3011}:8080"
    environment:
      TZ: Asia/Shanghai
      DETECTOR_DATA_DIR: /data
      DETECTOR_MASTER_KEY: ${DETECTOR_MASTER_KEY}
      DETECTOR_ADMIN_TOKEN: ${DETECTOR_ADMIN_TOKEN}
      DETECTOR_TIMEOUT_SECONDS: ${DETECTOR_TIMEOUT_SECONDS:-30}
      DETECTOR_NEW_API_INTERNAL_URL: ${DETECTOR_NEW_API_INTERNAL_URL:-http://mad-new-api:3000}
      DETECTOR_NEW_API_SERVICE_TOKEN: ${MODEL_DETECTOR_SERVICE_TOKEN}
    volumes:
      - ./data:/data
    depends_on:
      detector-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: ${MAD_PLATFORM_NETWORK:-mad-platform}
    external: true
