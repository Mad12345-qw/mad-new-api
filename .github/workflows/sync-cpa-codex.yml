name: Sync CPA Codex Executor

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current upstream commit
        required: false
        default: false
        type: boolean
  schedule:
    # 04:00 Asia/Shanghai. GitHub schedules are expressed in UTC.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: mad-new-api-build
  cancel-in-progress: false

jobs:
  sync-cpa-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out MadAPI build configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream CPA commit
        id: upstream
        run: |
          candidate=$(git ls-remote https://github.com/router-for-me/CLIProxyAPI.git refs/heads/main | awk '{print $1}')
          pinned=$(tr -d '[:space:]' < guards/cpa-upstream-commit.txt)
          test ${#candidate} -eq 40
          test ${#pinned} -eq 40
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$candidate" != "$pinned" ] || [ "${{ inputs.force || false }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream CPA candidate
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ steps.upstream.outputs.candidate }}
          path: cpa-source
          fetch-depth: 1

      - name: Set up Go
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-source/go.mod
          cache-dependency-path: cpa-source/go.sum

      - name: Apply and test the full MadAPI Responses service
        if: steps.upstream.outputs.changed == 'true'
        working-directory: cpa-source
        run: |
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0001-madapi-native-codex-dispatch.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0001-madapi-native-codex-dispatch.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0002-madapi-passthrough-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0003-madapi-responses-session-replay.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex-full/patches/0004-openai-chat-root-tool-schema.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0005-madapi-native-provider-authorization.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0006-openai-responses-string-input.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0007-claude-web-search-beta.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0008-claude-cloak-auth-attributes.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0008-claude-cloak-auth-attributes.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0009-claude-custom-tool-roundtrip.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0009-claude-custom-tool-roundtrip.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0010-claude-native-api-wire-mode.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0010-claude-native-api-wire-mode.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0011-claude-web-search-events.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0011-claude-web-search-events.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0012-claude-compaction-replay.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0012-claude-compaction-replay.patch"
          git apply --check "$GITHUB_WORKSPACE/server/cpa-codex/patches/0013-madapi-first-event-failover.patch"
          git apply "$GITHUB_WORKSPACE/server/cpa-codex/patches/0013-madapi-first-event-failover.patch"
          gofmt -w internal/config/config_types.go internal/runtime/executor/claude_executor_execute.go internal/runtime/executor/claude_executor_request.go internal/runtime/executor/claude_executor_stream.go internal/runtime/executor/claude_executor_test.go internal/runtime/executor/claude_executor_tokens.go internal/runtime/executor/openai_compat_executor.go internal/runtime/executor/openai_compat_executor_madapi_test.go internal/translator/claude/openai/responses/claude_openai-responses_request.go internal/translator/claude/openai/responses/claude_openai-responses_request_test.go internal/translator/claude/openai/responses/claude_openai-responses_response.go internal/translator/claude/openai/responses/claude_openai-responses_response_test.go internal/translator/openai/openai/responses/openai_openai-responses_request_test.go internal/translator/openai/openai/responses/openai_openai-responses_tools.go internal/watcher/synthesizer/config.go internal/watcher/synthesizer/config_test.go internal/api/madapi_native_codex.go internal/api/madapi_native_codex_test.go sdk/api/handlers/openai/madapi_responses_session.go sdk/api/handlers/openai/madapi_responses_session_test.go sdk/api/handlers/openai/openai_responses_handlers.go sdk/cliproxy/auth/conductor_execution.go sdk/cliproxy/auth/madapi_passthrough_test.go
          go test ./internal/api ./internal/runtime/executor ./internal/translator/claude/openai/responses ./internal/translator/openai/openai/responses ./internal/watcher/synthesizer ./sdk/api/handlers/openai ./sdk/cliproxy/auth

      - name: Build CPA Codex image
        if: steps.upstream.outputs.changed == 'true'
        run: docker build --pull --build-arg CPA_PATCHED=1 --file server/cpa-codex/Dockerfile --tag mad-cpa-codex:latest .

      - name: Verify CPA runtime dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: docker run --rm --entrypoint python3 mad-cpa-codex:latest --version

      - name: Verify CPA catalog synchronizer entrypoint
        if: steps.upstream.outputs.changed == 'true'
        run: docker run --rm --entrypoint /bin/sh mad-cpa-codex:latest -c 'test "$(head -n 1 /usr/local/bin/catalog-sync.py)" = "#!/usr/bin/env python3"'

      - name: Export CPA-only release assets
        if: steps.upstream.outputs.changed == 'true'
        run: |
          docker save mad-cpa-codex:latest | gzip -1 > mad-cpa-codex.tar.gz
          sha256sum mad-cpa-codex.tar.gz > mad-cpa-codex.tar.gz.sha256
          cp server/cpa-codex/sidecar-autodeploy.sh cpa-codex-autodeploy.sh
          cp server/cpa-codex/patch_nginx.py patch-cpa-codex-nginx.py
          cp server/cpa-codex/compose_reconcile.py compose-cpa-codex.py
          printf '%s\n' '${{ steps.upstream.outputs.candidate }}' > cpa-upstream-commit.txt
          sha256sum cpa-codex-autodeploy.sh > cpa-codex-autodeploy.sh.sha256
          sha256sum patch-cpa-codex-nginx.py > patch-cpa-codex-nginx.py.sha256
          sha256sum compose-cpa-codex.py > compose-cpa-codex.py.sha256
          sha256sum cpa-upstream-commit.txt > cpa-upstream-commit.txt.sha256

      - name: Publish only CPA Codex assets
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload build-latest \
            mad-cpa-codex.tar.gz \
            mad-cpa-codex.tar.gz.sha256 \
            cpa-codex-autodeploy.sh \
            cpa-codex-autodeploy.sh.sha256 \
            patch-cpa-codex-nginx.py \
            patch-cpa-codex-nginx.py.sha256 \
            compose-cpa-codex.py \
            compose-cpa-codex.py.sha256 \
            cpa-upstream-commit.txt \
            cpa-upstream-commit.txt.sha256 \
            --clobber

      - name: Record the verified CPA commit
        if: steps.upstream.outputs.changed == 'true'
        env:
          CANDIDATE: ${{ steps.upstream.outputs.candidate }}
        run: |
          printf '%s\n' "$CANDIDATE" > guards/cpa-upstream-commit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guards/cpa-upstream-commit.txt
          if git diff --cached --quiet; then
            echo 'The verified CPA commit was rebuilt without changing the pin.'
            exit 0
          fi
          git commit -m "chore: sync CPA Codex executor to ${CANDIDATE:0:12}"
          git push origin HEAD:main

      - name: Report no update
        if: steps.upstream.outputs.changed != 'true'
        run: echo 'CPA Codex executor is already aligned with upstream main.'
