services:
  new-api:
    image: mad-new-api:latest
    container_name: mad-cpa-sdk-release-newapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:13030:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: release-rehearsal-only
      MADAPI_CPA_DISPATCH_URL: http://cpa-codex-native:8317/internal/madapi/codex/execute
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  cpa-codex-native:
    image: alpine:3.23
    container_name: mad-cpa-sdk-release-legacy-cpa
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    restart: unless-stopped

  edge:
    image: nginx:1.28-alpine
    container_name: mad-cpa-sdk-release-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:13031:80"
    volumes:
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
