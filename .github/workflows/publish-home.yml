name: Publish MadAPI home

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madapi-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out MadAPI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate and package homepage
        shell: bash
        run: |
          node tests/mad-home-default-theme.mjs product/mad-home/default-theme.js
          grep -Fq 'https://mad.myddns.me/v1' product/mad-home/index.html
          grep -Fq 'https://mad.myddns.me/codex/v1' product/mad-home/index.html
          tar -C product/mad-home -czf mad-home.tar.gz .
          sha256sum mad-home.tar.gz > mad-home.tar.gz.sha256
          tar -tzf mad-home.tar.gz | grep -Fxq './index.html'

      - name: Update homepage release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view build-latest >/dev/null
          gh release upload build-latest \
            mad-home.tar.gz \
            mad-home.tar.gz.sha256 \
            --clobber
